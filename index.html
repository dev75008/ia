    <script>
      try {
        var theme = localStorage.getItem('ianews-theme')
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme
          document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'light' ? '#f3efe7' : '#0b0b0c')
        }
      } catch (error) { /* thème par défaut */ }
    </script>
