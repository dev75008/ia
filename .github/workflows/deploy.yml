name: Deploy IA News to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,22,37,52 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Les caches de traduction et de vignettes évitent de refaire le même travail
      # à chaque édition.
      - name: Restore translation and image caches
        uses: actions/cache@v4
        with:
          path: |
            data/translations.json
            data/images.json
          key: translations-${{ github.run_id }}
          restore-keys: |
            translations-

      - name: Refresh static RSS snapshot
        run: node scripts/fetch-feeds.mjs
        env:
          # Secrets absents ou vides : moteur ignoré, Google prend le relais.
          AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
          AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}

      - name: Build React app
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
